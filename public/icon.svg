<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Outer diamond / crystal boundary -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Back layer -->
    <path d="M 0 -160 L 140 -40 L 0 80 L -140 -40 Z" fill="url(#purple-glow)" opacity="0.6" />
    <!-- Middle layer -->
    <path d="M 0 -110 L 140 10 L 0 130 L -140 10 Z" fill="url(#cyan-glow)" opacity="0.85" />
    <!-- Front active layer -->
    <path d="M 0 -60 L 140 60 L 0 180 L -140 60 Z" fill="url(#cyan-glow)" />

    <!-- Center diamond core -->
    <polygon points="0,-40 35,0 0,40 -35,0" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
